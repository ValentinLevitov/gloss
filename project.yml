name: Translator
options:
  bundleIdPrefix: com.vlevitov
  developmentLanguage: en
  knownRegions: [en, ru]
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 4
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UAKG58FVZ8
targets:
  Translator:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlevitov.translator
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gloss
        CFBundleLocalizations: [en, ru]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take a photo of text to translate it.
        NSMicrophoneUsageDescription: Dictate text to translate or a question.
        NSSpeechRecognitionUsageDescription: Speech is recognized on the device to turn your dictation into text.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        com.apple.developer.translation-ui-provider.network-access: true
    entitlements:
      path: App/Translator.entitlements
      properties:
        com.apple.developer.translation-app: true
        com.apple.security.application-groups:
          - group.com.vlevitov.translator
    dependencies:
      - target: TranslationExtension
      - target: ShareExtension
  TranslationExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - TranslationExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlevitov.translator.translation
    info:
      path: TranslationExtension/Info.plist
      properties:
        CFBundleDisplayName: Gloss
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.public.translation-ui-provider
        com.apple.developer.translation-ui-provider.network-access: true
    entitlements:
      path: TranslationExtension/TranslationExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vlevitov.translator
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlevitov.translator.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Gloss
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vlevitov.translator
  UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlevitov.translator.unittests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Translator
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlevitov.translator.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Translator
schemes:
  Translator:
    build:
      targets:
        Translator: all
        UnitTests: [test]
        UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: CI.xctestplan
          defaultPlan: true
        - path: Demo.xctestplan
